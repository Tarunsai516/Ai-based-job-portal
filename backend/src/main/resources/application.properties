spring.application.name=talentsync-backend
server.port=${PORT:8080}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:80}

# --- Database Configuration (PostgreSQL for Render) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/talentsync}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Spring Data JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT Security Configuration ---
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Admin Account ---
# Set ADMIN_EMAIL and ADMIN_PASSWORD outside the repository. Never commit real values here.
app.admin.name=${ADMIN_NAME:TalentSync Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- File Upload Configuration ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
talentsync.resume.upload-dir=${RESUME_UPLOAD_DIR:./uploads/resumes}

# --- AI & Matching Engine Configuration ---
talentsync.ai.provider=gemini
talentsync.ai.api-key=${AI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
talentsync.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/}
talentsync.ai.model=${AI_MODEL:gemini-1.5-flash}
talentsync.ai.timeout-ms=30000
talentsync.matching.weights.semantic=${WEIGHT_SEMANTIC:0.30}
talentsync.matching.weights.skills=${WEIGHT_SKILLS:0.35}
talentsync.matching.weights.experience=${WEIGHT_EXPERIENCE:0.15}
talentsync.matching.weights.location=${WEIGHT_LOCATION:0.05}
talentsync.matching.weights.education=${WEIGHT_EDUCATION:0.05}
talentsync.matching.weights.keywords=${WEIGHT_KEYWORDS:0.10}

# --- Observability / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

