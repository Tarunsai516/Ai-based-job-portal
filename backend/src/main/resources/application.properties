spring.application.name=talentsync-backend
server.port=8080

# --- Database Configuration ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentsync?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# Spring Data JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT Security Configuration ---
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Admin Account ---
# Set ADMIN_EMAIL and ADMIN_PASSWORD outside the repository. Never commit real values here.
app.admin.name=${ADMIN_NAME:TalentSync Admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- File Upload Configuration ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
talentsync.resume.upload-dir=${RESUME_UPLOAD_DIR:./uploads/resumes}

# --- AI & Matching Engine Configuration ---
talentsync.ai.provider=${AI_PROVIDER:openai}
talentsync.ai.api-key=${AI_API_KEY:}
talentsync.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
talentsync.ai.model=${AI_MODEL:gpt-4o-mini}
talentsync.ai.timeout-ms=${AI_TIMEOUT_MS:10000}
talentsync.matching.weights.semantic=${WEIGHT_SEMANTIC:0.30}
talentsync.matching.weights.skills=${WEIGHT_SKILLS:0.35}
talentsync.matching.weights.experience=${WEIGHT_EXPERIENCE:0.15}
talentsync.matching.weights.location=${WEIGHT_LOCATION:0.05}
talentsync.matching.weights.education=${WEIGHT_EDUCATION:0.05}
talentsync.matching.weights.keywords=${WEIGHT_KEYWORDS:0.10}

# --- Observability / Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# --- Redis & RabbitMQ Integration (Container ready) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
